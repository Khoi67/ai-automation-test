name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to execute (all, ui, api)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ui
          - api

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
            
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        
      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        
      - name: Run Tests (with Allure)
        run: |
          if [ "${{ github.event.inputs.test_suite }}" = "ui" ]; then
            npm run test:ui -- --reporter=line,allure-playwright
          elif [ "${{ github.event.inputs.test_suite }}" = "api" ]; then
            npm run test:api -- --reporter=line,allure-playwright
          else
            npm run test:allure
          fi
        env:
          UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TOKEN_CYBERSOFT: ${{ secrets.TOKEN_CYBERSOFT }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          
      - name: Generate Allure Report
        if: always()
        run: npm run generate:allure
          
      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
          
      - name: Upload Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

  deploy-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report
          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [test, deploy-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            TEST_RESULT="${{ needs.test.result }}"
            if [ "$TEST_RESULT" = "success" ]; then
              STATUS_ICON="✅"
              STATUS_TEXT="PASS TOÀN BỘ"
            else
              STATUS_ICON="❌"
              STATUS_TEXT="CÓ LỖI (FAIL)"
            fi

            COMMIT_MSG="${{ github.event.head_commit.message }}"
            FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1)

            MSG="🤖 <b>[CI/CD GITHUB ACTIONS HOÀN TẤT]</b>%0A%0A"
            MSG="${MSG}⚡ <b>Kết quả:</b> ${STATUS_ICON} <code>${STATUS_TEXT}</code>%0A"
            MSG="${MSG}📌 <b>Nhánh:</b> <code>${{ github.ref_name }}</code>%0A"
            MSG="${MSG}👤 <b>Tác giả:</b> ${{ github.actor }}%0A"
            MSG="${MSG}📝 <b>Commit:</b> <code>${FIRST_LINE}</code>%0A"
            MSG="${MSG}📊 <b>Allure Report:</b> https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/%0A%0A"
            MSG="${MSG}🔗 <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Xem chi tiết GitHub Actions Run</a>"

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=HTML"
          else
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured in secrets. Skipping Telegram notification."
          fi


